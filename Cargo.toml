[package]
name = "niimbot-zpl"
version = "0.1.0"
edition = "2021"
description = "Open-source Niimbot B1 client: ZPL in, thermal print out (USB/Bluetooth)"

[lib]
name = "niimbot_zpl"
path = "src/lib.rs"

[[bin]]
name = "niimbot-zpl"
path = "src/main.rs"

[dependencies]
slint = "1"
serialport = { version = "4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
font8x8 = { version = "0.3", default-features = false, features = ["std", "unicode"] }
thiserror = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = "1"
